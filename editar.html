<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Editar Pessoa</title>
    <script src="js/editar.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Editar Pessoa</h1>
        <form id="formEditar">
            <label for="nome">Nome</label>
            <input type="text" id="nome" required maxlength="100">

            <label for="idade">Idade</label>
            <input type="number" id="idade" name="idade" required max="130">

            <div class="acoes">
                <button class="submit">Salvar Alterações</button>
                <a href="index.html" class="botao secundario">Cancelar</a>
            </div>
        </form>
        <p id="mensagem" role="status"></p>
    </main>
</body>
</html>
